# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.dev.yml — DEVELOPMENT (hot-reload)
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml down
#
# Your source is mounted into the container so Vite HMR and tsx --watch
# pick up every file save automatically — no rebuild needed.
# ─────────────────────────────────────────────────────────────────────────────

services:
  poly-weather-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: poly-weather-dev
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      NODE_ENV: development
      DOCKER: "true"
      PORT: "5000"
    volumes:
      # Mount source for live hot-reload
      - .:/app
      # Preserve the container's node_modules — do NOT overlay with host's
      - /app/node_modules
    stdin_open: true
    tty: true
